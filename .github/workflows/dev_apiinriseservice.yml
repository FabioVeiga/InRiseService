name: Build and deploy ASP.Net Core app to Azure Web App - apiinriseservice

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Create .pem file if not exists
        shell: pwsh
        run: |
          # Defina o caminho onde o arquivo .pem será criado
          $PEM_DIR = "caminho"
          $PEM_FILE = "$PEM_DIR/ca.pem"

          # Verifique se o diretório existe, se não, crie-o
          if (-not (Test-Path -Path $PEM_DIR)) {
            New-Item -ItemType Directory -Path $PEM_DIR -Force
          }

          # Crie o arquivo .pem com conteúdo de exemplo (substitua pelo conteúdo real do seu certificado)
          $pemContent = @"
          -----BEGIN CERTIFICATE-----
          [Seu conteúdo de certificado]
          -----END CERTIFICATE-----
          "@
          
          # Crie ou sobrescreva o arquivo .pem
          Set-Content -Path $PEM_FILE -Value $pemContent
          
          # Verifique se o arquivo foi criado com sucesso
          if (Test-Path -Path $PEM_FILE) {
            Write-Host "Arquivo .pem criado com sucesso em $PEM_FILE"
          } else {
            Write-Host "Erro ao criar o arquivo .pem"
            exit 1
          }

      - name: Copy .pem file to destination
        shell: pwsh
        run: |
          # Caminho de origem e destino para copiar o arquivo
          $SOURCE_PATH = "caminho/ca.pem"
          $DEST_PATH = "caminho/ca.pem"

          # Copiar o arquivo para o destino
          Copy-Item -Path $SOURCE_PATH -Destination $DEST_PATH -Force

          Write-Host "Arquivo .pem copiado para $DEST_PATH"
        
      - name: Login to Azure

        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_73D85DB5387C4B7293EA1F51993A967C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6B8A7C2BFD39489195A631D1BAFB2BAB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FEE4818FF6B446C49500A72E348EFF9B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'apiinriseservice'
          slot-name: 'Production'
          package: .

          