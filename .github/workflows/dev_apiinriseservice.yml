name: Build and deploy ASP.Net Core app to Azure Web App - apiinriseservice

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # Requisito para JWT
      contents: read  # Para usar o Key Vault

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch secrets from Azure Key Vault
        id: azure-key-vault
        uses: azure/azure-keyvault@v2
        with:
          secrets: |
            AZUREAPPSERVICE_CLIENTID
            AZUREAPPSERVICE_TENANTID
            AZUREAPPSERVICE_SUBSCRIPTIONID
            CA_CERT_VALUE
          keyvault: 'SecretsInriseDev'

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'apiinriseservice'
          slot-name: 'Production'
          package: .

      - name: Create .pem file if not exists
        shell: pwsh
        run: |
          # Caminho para o arquivo .pem
          $PEM_DIR = "caminho"
          $PEM_FILE = "$PEM_DIR/ca.pem"

          # Verifique se o diretório existe, se não, crie-o
          if (-not (Test-Path -Path $PEM_DIR)) {
            New-Item -ItemType Directory -Path $PEM_DIR -Force
          }

          # Crie o arquivo .pem com conteúdo do secret
          $pemContent = @"
          -----BEGIN CERTIFICATE-----
          ${{ steps.azure-key-vault.outputs.CA_CERT_VALUE }}
          -----END CERTIFICATE-----
          "@

          # Crie ou sobrescreva o arquivo .pem
          Set-Content -Path $PEM_FILE -Value $pemContent

          # Verifique se o arquivo foi criado com sucesso
          if (Test-Path -Path $PEM_FILE) {
            Write-Host "Arquivo .pem criado com sucesso em $PEM_FILE"
          } else {
            Write-Host "Erro ao criar o arquivo .pem"
            exit 1
          }
